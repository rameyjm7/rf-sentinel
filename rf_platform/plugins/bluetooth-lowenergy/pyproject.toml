[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluetooth-lowenergy"
version = "0.1.0"
description = "RF Sentinel BLE advertising receiver plugin"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "requests>=2.31",
  "websocket-client>=1.6",
]

[project.scripts]
bluetooth-lowenergy = "bluetooth_lowenergy.cli:main"
ble_scanner = "bluetooth_lowenergy.cli:main"
